
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Experiments | Kenia's Portfolio</title>
</head>

<body>
  <header>
    <h1>HTML Experiments</h1>


  </header>

  <main>

    <section>
      <h2>Audio Experiment</h2>

      <audio controls>
        <source src="media/sample-6s.mp3" type="audio/mpeg">
        Your browser does not support audio.
      </audio>
    </section>


    <section>
      <h2>Video Experiment</h2>

      <video controls width="400">
        <source src="media/sample-5s.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </section>

    <section>
      <h2>Canvas Experiment</h2>

      <canvas id="myCanvas" width="300" height="150">
        Your browser does not support canvas.
      </canvas>
    </section>

  

   
    <section>
      <h2>Hello World Custom Element</h2>

      <p>
        Open the browser console to see
        the Hello World message.
      </p>

      <hello-world></hello-world>
    </section>
  </main>

  <footer>
    <p>HTML Experiments | 2026</p>
  </footer>


<section>
  <h2>SVG Demonstration</h2>

  <svg width="150" height="150"
       viewBox="0 0 150 150"
       role="img"
       aria-label="Blue circle">
    <circle cx="75" cy="75" r="50"
            fill="blue"
            stroke="black"
            stroke-width="3"/>
  </svg>
</section>


  <script>
    class HelloWorld extends HTMLElement {
      connectedCallback() {
        console.log("Hello World!");
      }
    }

    customElements.define("hello-world", HelloWorld);

    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(50, 30, 150, 80);
  </script>
</body>
</html>
